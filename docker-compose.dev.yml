# Dev-only services on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile faker up -d
services:
  faker:
    image: ${OCI_REGISTRY:-ghcr.io}/${OCI_PROJECT:-jrmatherly}/serviceradar-faker:${APP_TAG:-latest}
    container_name: serviceradar-faker
    hostname: faker
    profiles:
      - faker
      - full
    ports:
      - "8081:8080"
    volumes:
      - ./logs:/var/log/serviceradar
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      serviceradar-net:
        aliases:
          - faker.serviceradar
    restart: unless-stopped
