[server]
bind_address = "0.0.0.0"
port = 4317

[nats]
url = "tls://host01.example.com:4222"
subject = "otel"
logs_subject = "logs.otel"
stream = "events"
stream_owner = false
timeout_secs = 30
creds_file = "/etc/serviceradar/creds/otel.creds"

[nats.tls]
cert_file = "/etc/serviceradar/certs/otel.pem"
key_file = "/etc/serviceradar/certs/otel-key.pem"
ca_file = "/etc/serviceradar/certs/ca-chain.pem"

[grpc_tls]
cert_file = "/etc/serviceradar/certs/otel.pem"
key_file = "/etc/serviceradar/certs/otel-key.pem"
ca_file = "/etc/serviceradar/certs/ca-chain.pem"
