name: Source Security Scan

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  schedule:
    # Weekly, Mondays 04:53 UTC. Advisories land on their own schedule.
    - cron: '53 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-security:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install Syft
        run: ./scripts/install-syft.sh

      - name: Install OSV-Scanner
        run: ./scripts/install-osv-scanner.sh

      - name: Generate source SBOM and vulnerability report
        run: |
          set -euo pipefail
          rm -rf out/security/source
          mkdir -p out/security/source

          osv_exit=0
          osv-scanner scan source -r . \
            --format json \
            --output-file out/security/source/serviceradar-source.osv.json || osv_exit=$?

          echo "OSV_EXIT=${osv_exit}" >> "${GITHUB_ENV}"

          syft scan dir:. \
            -c .syft.yaml \
            -o spdx-json=out/security/source/serviceradar-source.spdx.json \
            -o syft-text=out/security/source/serviceradar-source.sbom.txt

      - name: Bundle source security artifacts
        run: |
          set -euo pipefail
          tar -C out/security/source -czf out/security/serviceradar-source-security.tar.gz .

      - name: Upload source security bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: serviceradar-source-security
          path: out/security/serviceradar-source-security.tar.gz
          if-no-files-found: error

      - name: Summarize source security outputs
        run: |
          set -euo pipefail
          {
            echo "## Source Security Scan"
            echo
            echo "Generated:"
            echo "- \`serviceradar-source.spdx.json\`"
            echo "- \`serviceradar-source.sbom.txt\`"
            echo "- \`serviceradar-source.osv.json\`"
            echo
            if [[ "${OSV_EXIT:-0}" -eq 0 ]]; then
              echo "OSV findings: none detected"
            else
              echo "OSV findings: vulnerabilities detected (see JSON artifact)"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
