# NATS Leaf Server Configuration
# Generated for EdgeSite: Site 01 (site01)
# Generated at: 2026-10-31T16:12:16.877263Z

server_name: nats-site01
logfile: "/var/log/nats/nats.log"
debug: false

# Listen for local clients (collectors)
listen: 0.0.0.0:4222

# Enable mTLS for local client communication
tls {
    cert_file: "/etc/nats/certs/nats-server.pem"
    key_file: "/etc/nats/certs/nats-server-key.pem"
    ca_file: "/etc/nats/certs/ca-chain.pem"
    verify_and_map: true
}

# Local clients are known by their certificate alone. This block is rendered
# from server-owned records; no account seed or broad platform user is
# installed on the leaf, and a client with no user here is refused.
authorization {
    default_permissions: {
        publish: { deny: [">"] }
        subscribe: { deny: [">"] }
    }
    users: [
        {
            user: "CN=flowgger-11111111222243338444555555550001.default.serviceradar"
            permissions: {
                publish: {
                    allow: ["logs.syslog"], deny: ["$SYS.>", "_INBOX.>"]
                }
                subscribe: {
                    allow: ["_INBOX.>"], deny: ["$SYS.>"]
                }
            }
        },
        {
            user: "CN=trapd-11111111222243338444555555550002.default.serviceradar"
            permissions: {
                publish: {
                    allow: ["logs.snmp"], deny: ["$SYS.>", "_INBOX.>"]
                }
                subscribe: {
                    allow: ["_INBOX.>"], deny: ["$SYS.>"]
                }
            }
        },
        {
            user: "CN=otel-11111111222243338444555555550003.default.serviceradar"
            permissions: {
                publish: {
                    allow: ["otel.traces.>", "otel.metrics.>", "logs.otel"], deny: ["$SYS.>", "_INBOX.>"]
                }
                subscribe: {
                    allow: ["_INBOX.>"], deny: ["$SYS.>"]
                }
            }
        },
        {
            user: "CN=netflow-11111111222243338444555555550004.default.serviceradar"
            permissions: {
                publish: {
                    allow: ["flows.raw.netflow"], deny: ["$SYS.>", "_INBOX.>"]
                }
                subscribe: {
                    allow: ["_INBOX.>"], deny: ["$SYS.>"]
                }
            }
        },
        {
            user: "CN=sflow-11111111222243338444555555550005.default.serviceradar"
            permissions: {
                publish: {
                    allow: ["flows.raw.sflow"], deny: ["$SYS.>", "_INBOX.>"]
                }
                subscribe: {
                    allow: ["_INBOX.>"], deny: ["$SYS.>"]
                }
            }
        }
    ]
}

# Answers $JS.API locally. Nothing creates a stream here, so nothing is buffered during a WAN outage
jetstream {
    store_dir: /var/lib/nats/jetstream
    max_memory_store: 1G
    max_file_store: 10G
    domain: edge
}

# Leaf Node configuration to connect to the SaaS NATS cluster
leafnodes {
    remotes = [
        {
            url: "tls://hub.example.com:7422"


            # mTLS configuration for leaf-to-SaaS connection
            tls {
                cert_file: "/etc/nats/certs/nats-leaf.pem"
                key_file: "/etc/nats/certs/nats-leaf-key.pem"
                ca_file: "/etc/nats/certs/ca-chain.pem"
            }
        }
    ]
}
