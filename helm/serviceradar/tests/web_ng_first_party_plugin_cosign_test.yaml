suite: web-ng first-party plugin cosign verification contract
templates:
  - templates/web.yaml
tests:
  - it: ships the ServiceRadar release cosign public key by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_FIRST_PARTY_PLUGIN_COSIGN_PUBLIC_KEY
            value: |
              -----BEGIN PUBLIC KEY-----
              MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEtCe52WILxH2SH9tk2tY7pOoO20l8
              ZBWkNSowsW9Nb4pIy0JWIsovQzqYYIq5QZkPPDgFJY9DWHgGx71aCoz0uQ==
              -----END PUBLIC KEY-----
          count: 1
        documentSelector:
          path: kind
          value: Deployment

  - it: lets an operator override the verification key for a private plugin registry
    set:
      webNg.firstPartyPluginImport.cosignPublicKey: |
        -----BEGIN PUBLIC KEY-----
        operator-supplied-key
        -----END PUBLIC KEY-----
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SERVICERADAR_FIRST_PARTY_PLUGIN_COSIGN_PUBLIC_KEY
            value: |
              -----BEGIN PUBLIC KEY-----
              operator-supplied-key
              -----END PUBLIC KEY-----
          count: 1
        documentSelector:
          path: kind
          value: Deployment
