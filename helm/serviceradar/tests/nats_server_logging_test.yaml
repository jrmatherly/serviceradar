suite: nats-server debug and trace logging follow nats.debug / nats.trace
templates:
  - templates/nats.yaml
release:
  namespace: sr-nats-logging
tests:
  # The NATS config used to hard-code `debug: true`, so every installed server
  # logged [DBG] RAFT and ping-timer lines with no value to turn it off.
  - it: renders debug and trace off in the StatefulSet server config by default
    template: templates/nats.yaml
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '\n\s*debug: false\n\s*trace: false\n'

  - it: turns debug and trace on when the values are true
    template: templates/nats.yaml
    set:
      nats.debug: true
      nats.trace: true
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '\n\s*debug: true\n\s*trace: true\n'
